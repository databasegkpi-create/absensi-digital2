<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <base target="_top">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    :root { 
      --gkpi-blue: #003366; 
      --gkpi-blue-dark: #001a33;
      --gkpi-gold: #ffcc00; 
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(255, 255, 255, 0.5);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body { 
      margin: 0;
      padding: 40px 20px; 
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; 
      background-color: #050b14; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center; /* Memusatkan secara vertikal */
      align-items: center; /* Memusatkan secara horizontal */
      -webkit-font-smoothing: antialiased;
    }

    /* Background Efek Blur Elegan */
    body::before {
      content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('https://lh3.googleusercontent.com/d/1fjbh4r3PIUOuPJpRuc1tmyWGlr155TgJ'); 
      background-size: cover; background-position: center;
      filter: grayscale(100%) blur(8px); 
      opacity: 0.35; z-index: -1; 
    }

    /* --- CONTAINER SEAMLESS --- */
    .app-container { 
      width: 100%; 
      max-width: 420px; 
      margin: auto; 
      background: transparent; /* Menghilangkan blok putih kotak */
      border: none;
      box-shadow: none;
      position: relative;
      transition: all 0.4s ease;
    }

    .app-header { 
      background: transparent; 
      color: white; padding: 0 10px 25px; text-align: center; 
      border-bottom: none; 
    }
    .app-header h4 { font-weight: 900; margin: 0; letter-spacing: 1px; font-size: 1.8rem; text-shadow: 0 4px 15px rgba(0,0,0,0.8);}
    .app-header p { color: var(--gkpi-gold); opacity: 1; font-size: 0.85rem; margin-top: 8px; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.8);}
    
    .app-body { padding: 0; }
    
    /* --- UI LOGIN --- */
    .login-container { text-align: center; }
    .logo-gkpi {
      width: 110px; height: 110px; object-fit: contain; margin-bottom: 25px; 
      background-color: rgba(255, 255, 255, 0.95); border-radius: 50%; padding: 12px; 
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); border: none;
    }
    .login-title { font-weight: 800; color: #ffffff; font-size: 1.6rem; margin-bottom: 8px; text-shadow: 0 4px 10px rgba(0,0,0,0.8); }
    .login-subtitle { font-size: 0.95rem; color: #cbd5e1; margin-bottom: 35px; text-shadow: 0 2px 6px rgba(0,0,0,0.8); font-weight: 500;}
    
    .input-modern { position: relative; margin-bottom: 20px; }
    .input-modern i { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 1.2rem; transition: color 0.3s ease; z-index: 2; }
    .input-modern .form-control {
      padding-left: 55px; height: 62px; border-radius: 20px; border: 2px solid transparent; background-color: rgba(255,255,255,0.92);
      font-size: 1.05rem; font-weight: 600; color: var(--text-dark); box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: all 0.3s ease;
    }
    .input-modern .form-control:focus { background-color: #ffffff; border-color: var(--gkpi-blue); box-shadow: 0 0 0 4px rgba(0, 51, 102, 0.4), 0 10px 30px rgba(0,0,0,0.3); outline: none;}
    .input-modern:focus-within i { color: var(--gkpi-blue); }
    
    .btn-login {
      background: linear-gradient(135deg, var(--gkpi-blue), #004a99); color: white; height: 62px; border-radius: 20px;
      font-size: 1.15rem; font-weight: 800; letter-spacing: 1.5px; display: flex; justify-content: center; align-items: center;
      gap: 12px; width: 100%; border: none; margin-top: 30px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); transition: all 0.2s ease; cursor: pointer;
    }
    .btn-login:active { transform: translateY(3px) scale(0.97); box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5); }

    .copyright-text {
      margin-top: 40px; font-size: 0.8rem; color: rgba(255, 255, 255, 0.6); font-weight: 600;
      letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .copyright-text span { color: var(--gkpi-gold); opacity: 0.9;}

    /* --- WIDGET ABSENSI (GLASSMORPHISM) --- */
    #halamanAbsen { display: none; }
    
    /* Komponen Kaca Buram (Frosted Glass) */
    .welcome-card, #formAbsen, #riwayatContainer { 
        background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        border: 1px solid var(--glass-border); border-radius: 24px; padding: 25px 20px; 
        box-shadow: 0 20px 40px rgba(0,0,0,0.3); margin-bottom: 25px;
    }
    .welcome-card { text-align: center; padding: 30px 20px;}
    .welcome-card small { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted);}
    .welcome-card strong { font-size: 1.5rem; color: var(--gkpi-blue-dark); font-weight: 900; display: block; margin-top: 6px; letter-spacing: -0.5px;}

    .form-label { font-size: 0.8rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: block;}
    
    /* Tombol Toggle Ala iOS */
    .btn-group {
        background: rgba(0, 0, 0, 0.04); padding: 6px; border-radius: 20px !important; width: 100%; display: flex;
    }
    .btn-group .btn { border-radius: 16px !important; border: none !important; font-weight: 800; padding: 14px; font-size: 0.9rem; color: var(--text-muted); background: transparent; transition: all 0.3s ease;}
    
    .btn-check:checked + .btn-outline-info { background-color: var(--gkpi-blue); color: white; box-shadow: 0 6px 15px rgba(0, 51, 102, 0.3);}
    .btn-check:checked + .btn-outline-danger { background-color: #dc2626; color: white; box-shadow: 0 6px 15px rgba(220, 38, 38, 0.3);}
    .btn-check:checked + .btn-outline-success { background-color: #16a34a; color: white; box-shadow: 0 6px 15px rgba(22, 163, 74, 0.3);}
    .btn-check:checked + .btn-outline-warning { background-color: #d97706; color: white; box-shadow: 0 6px 15px rgba(217, 119, 6, 0.3);}

    .status-badge { display: flex; align-items: center; justify-content: center; padding: 14px; border-radius: 16px; font-weight: 700; font-size: 0.9rem; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: none;}
    .status-loading { background: rgba(255, 255, 255, 0.9); color: var(--text-muted); }
    .status-success { background: #dcfce7; color: #15803d; }
    .status-danger { background: #fee2e2; color: #b91c1c; }
    .status-info { background: #e0f2fe; color: #0369a1; }

    .camera-label { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 35px 20px; background: rgba(255, 255, 255, 0.6); border: 2px dashed #cbd5e1; border-radius: 20px; cursor: pointer; transition: all 0.3s; }
    .camera-label i { color: #94a3b8; font-size: 3rem; transition: all 0.3s ease; margin-bottom: 12px;}
    .camera-label span { color: var(--text-dark); font-size: 0.95rem;}
    .camera-label:active { transform: scale(0.98); background: rgba(255,255,255,0.9); }
    .camera-label.has-photo { background: #f0f9ff; border-color: var(--gkpi-blue); border-style: solid; }
    .camera-label.has-photo i { color: var(--gkpi-blue); }
    #previewGambarStatis { width: 100%; height: auto; max-height: 350px; object-fit: cover; border-radius: 16px; margin-top: 20px; display: none; border: 4px solid var(--gkpi-blue); box-shadow: 0 15px 30px rgba(0,0,0,0.2); }

    .btn-utama { 
      background: linear-gradient(135deg, var(--gkpi-blue), #004a99); color: white; font-weight: 800; padding: 18px; 
      border-radius: 20px; width: 100%; border: none; text-transform: uppercase; margin-top: 15px; margin-bottom: 5px;
      box-shadow: 0 15px 35px rgba(0, 51, 102, 0.4); transition: all 0.2s ease; cursor: pointer; font-size: 1.1rem; letter-spacing: 1.5px;
    }
    .btn-utama:active { transform: translateY(3px) scale(0.97); box-shadow: 0 5px 15px rgba(0, 51, 102, 0.4);} 
    .btn-utama:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; background: #64748b;}

    #riwayatContainer { overflow-x: auto; padding: 25px; margin-top: 10px;}
    #riwayatContainer h6 { font-size: 0.95rem; font-weight: 900; letter-spacing: 1px; color: var(--gkpi-blue-dark); text-transform: uppercase; margin-bottom: 20px;}
    .table-riwayat { width: 100%; font-size: 0.9rem; border-collapse: separate; border-spacing: 0; min-width: 280px; }
    .table-riwayat th { background: rgba(0, 51, 102, 0.05); padding: 14px 12px; color: var(--gkpi-blue); border-bottom: 2px solid rgba(0,0,0,0.05); font-weight: 800; text-transform: uppercase; font-size: 0.75rem; }
    .table-riwayat th:first-child { border-top-left-radius: 12px; border-bottom-left-radius: 12px;}
    .table-riwayat th:last-child { border-top-right-radius: 12px; border-bottom-right-radius: 12px;}
    .table-riwayat td { padding: 15px 12px; border-bottom: 1px solid rgba(0,0,0,0.05); font-weight: 600; color: var(--text-dark);}
    .table-riwayat tr:last-child td { border-bottom: none; }

    @media (max-width: 380px) {
      .app-header h4 { font-size: 1.5rem; }
      .welcome-card, #formAbsen, #riwayatContainer { padding: 20px 15px; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="app-header">
    <h4>Absensi Digital</h4>
    <p>Kantor Sinode GKPI</p>
  </div>
  
  <div class="app-body">
    <div id="halamanLogin" class="login-container">
      <img src="https://upload.wikimedia.org/wikipedia/id/0/0d/Logo_GKPI.png" alt="Logo GKPI" class="logo-gkpi">
      <h5 class="login-title">Selamat Datang</h5>
      <p class="login-subtitle">Silakan masuk menggunakan akun Anda</p>
      
      <div class="input-modern text-start">
        <i class="fas fa-user"></i>
        <input type="text" id="inputUsername" class="form-control" placeholder="Username / NIK" autocomplete="off">
      </div>
      
      <div class="input-modern text-start">
        <i class="fas fa-lock"></i>
        <input type="password" id="inputPin" class="form-control" placeholder="PIN Akses">
      </div>
      
      <button type="button" id="btnLogin" class="btn-login" onclick="prosesLogin()">
        <span>MASUK</span> <i class="fas fa-sign-in-alt"></i>
      </button>

      <div class="copyright-text">
        © 2026 Copyright by <span>Diovery</span>
      </div>
    </div>

    <div id="halamanAbsen">
      <div class="welcome-card">
        <small class="text-muted d-block">Selamat datang,</small>
        <strong id="tampilNamaLengkap">Nama Pegawai</strong>
      </div>

      <div id="gpsStatus" class="status-badge status-loading">
        <i class="fas fa-satellite-dish fa-spin me-2"></i> Mencari sinyal GPS...
      </div>

      <div id="formAbsen">
        <input type="hidden" id="namaPegawai">

       <div class="mb-4">
          <label class="form-label"><i class="fas fa-map-marker-alt me-1"></i> Lokasi Kerja</label>
          <div class="btn-group w-100" role="group">
            <input type="radio" class="btn-check" name="modeLokasi" id="locKantor" value="KANTOR" checked onchange="cekLokasi()">
            <label class="btn btn-outline-info" for="locKantor">KANTOR</label>
            
            <input type="radio" class="btn-check" name="modeLokasi" id="locLuar" value="LAPANGAN" onchange="cekLokasi()">
            <label class="btn btn-outline-danger" for="locLuar">LAPANGAN</label>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label"><i class="fas fa-clipboard-check me-1"></i> Status Kehadiran</label>
          <div class="btn-group w-100" role="group">
            <input type="radio" class="btn-check" name="tipeAbsen" id="masuk" value="MASUK" checked>
            <label class="btn btn-outline-success" for="masuk">DATANG</label>
            
            <input type="radio" class="btn-check" name="tipeAbsen" id="pulang" value="PULANG">
            <label class="btn btn-outline-warning" for="pulang">PULANG</label>
          </div>
        </div>

        <div class="mb-4">
          <input type="file" id="fotoKamera" accept="image/*" capture="environment" class="d-none">
          <label for="fotoKamera" id="uiKamera" class="camera-label">
            <i class="fas fa-camera mb-2" id="ikonKamera"></i>
            <span id="teksKamera" class="fw-bold">Ketuk untuk Ambil Foto</span>
          </label>
          <img id="previewGambarStatis" src="">
        </div>

        <button type="button" id="btnSubmit" class="btn-utama" onclick="prosesAbsen()" disabled>
          KIRIM ABSENSI <i class="fas fa-paper-plane ms-1"></i>
        </button>
      </div>

      <div id="riwayatContainer">
        <h6 class="text-center">
          <i class="fas fa-history me-1"></i> 5 Riwayat Terakhir
        </h6>
        <table class="table-riwayat">
          <thead>
            <tr>
              <th>Waktu</th>
              <th>Tipe</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="isiRiwayat">
            <tr><td colspan="3" class="text-center py-3 text-muted">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<script>
  // ====================================================================
  // API URL
  // ====================================================================
  const API_URL = "https://script.google.com/macros/s/AKfycbytSUNchsBEgPFA-9bmutWeBvdMTsOt2FHkyy3FzXSEGJodjOGPdHoXDj34Z2fcgF6sHw/exec"; 

  const KANTOR_LAT = 2.9507367687454646; 
  const KANTOR_LNG = 99.06044938808277; 
  const MAX_JARAK = 50; 
  let statusLokasi = "Mencari...";
  let base64String = ""; 

  function aturOtomatisAbsen() {
    const jamSekarang = new Date().getHours();
    if (jamSekarang >= 16) {
      document.getElementById('pulang').checked = true;
    } else {
      document.getElementById('masuk').checked = true;
    }
  }

  function prosesLogin() {
    const user = document.getElementById('inputUsername').value;
    const pin = document.getElementById('inputPin').value;
    const btn = document.getElementById('btnLogin');

    if(!user || !pin) {
      Swal.fire('Oops!', 'Isi Username & PIN', 'warning');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> MEMPROSES...';

    const targetUrl = `${API_URL}?action=login&user=${encodeURIComponent(user)}&pin=${encodeURIComponent(pin)}`;

    fetch(targetUrl)
      .then(response => response.json())
      .then(res => {
        if (res.sukses) {
          sessionStorage.setItem('statusLogin', 'sudah_login');
          sessionStorage.setItem('namaPegawaiSesi', res.namaLengkap);
          
          document.getElementById('halamanLogin').style.display = 'none';
          document.getElementById('halamanAbsen').style.display = 'block';
          document.getElementById('tampilNamaLengkap').innerText = res.namaLengkap;
          document.getElementById('namaPegawai').value = res.namaLengkap;
          
          muatRiwayat(res.namaLengkap);
          pancingIzinSistem();
          cekLokasi();
          aturOtomatisAbsen();
        } else {
          Swal.fire('Gagal', res.pesan, 'error');
          btn.disabled = false; 
          btn.innerHTML = '<span>MASUK</span> <i class="fas fa-sign-in-alt ms-1"></i>';
        }
      })
      .catch(err => {
        Swal.fire('Error Server', 'Tidak dapat terhubung ke sistem backend.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<span>MASUK</span> <i class="fas fa-sign-in-alt ms-1"></i>';
      });
  }

  document.getElementById('fotoKamera').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 400;
          let width = img.width, height = img.height;
          if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          base64String = canvas.toDataURL('image/jpeg', 0.6);
          document.getElementById('previewGambarStatis').src = base64String;
          document.getElementById('previewGambarStatis').style.display = 'block';
          document.getElementById('uiKamera').classList.add('has-photo');
          document.getElementById('teksKamera').innerText = "Foto Berhasil Ditangkap!";
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }
  });

  function hitungJarak(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
    const a = Math.sin((lat2-lat1)*Math.PI/180/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin((lon2-lon1)*Math.PI/180/2)**2;
    return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
  }

  function cekLokasi() {
    const badge = document.getElementById('gpsStatus'), btn = document.getElementById('btnSubmit');
    const mode = document.querySelector('input[name="modeLokasi"]:checked').value;
    badge.className = "status-badge status-loading";
    navigator.geolocation.getCurrentPosition(function(pos) {
      const jarak = hitungJarak(KANTOR_LAT, KANTOR_LNG, pos.coords.latitude, pos.coords.longitude);
      if (mode === "KANTOR") {
        if (jarak <= MAX_JARAK) {
          statusLokasi = "Valid (Kantor)";
          badge.className = "status-badge status-success"; badge.innerHTML = "<i class='fas fa-check-circle me-1'></i> Lokasi Sesuai ("+jarak+"m)";
          btn.disabled = false;
        } else {
          badge.className = "status-badge status-danger"; badge.innerHTML = "<i class='fas fa-times-circle me-1'></i> Terlalu Jauh ("+jarak+"m)";
          btn.disabled = true;
        }
      } else {
        statusLokasi = "Lapangan ("+pos.coords.latitude+","+pos.coords.longitude+")";
        badge.className = "status-badge status-info"; badge.innerHTML = "<i class='fas fa-map-marked-alt me-1'></i> Mode Lapangan Aktif";
        btn.disabled = false;
      }
    }, function() { badge.innerHTML = "<i class='fas fa-exclamation-triangle me-1'></i> Aktifkan GPS Anda!"; }, {enableHighAccuracy:true});
  }

  function prosesAbsen() {
    if(!base64String) { Swal.fire('Foto?', 'Ambil selfie dulu!', 'warning'); return; }
    const btn = document.getElementById('btnSubmit');
    const namaUser = document.getElementById('namaPegawai').value;
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> MENGIRIM...';

    const payload = {
      action: "absen",
      data: {
        nama: namaUser,
        tipe: document.querySelector('input[name="tipeAbsen"]:checked').value,
        statusLokasi: statusLokasi,
        fotoBase64: base64String
      }
    };

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(res => {
      if(res.sukses) {
        Swal.fire('Berhasil', res.pesan, 'success').then(() => {
          base64String = "";
          document.getElementById('previewGambarStatis').style.display = 'none';
          document.getElementById('uiKamera').classList.remove('has-photo');
          document.getElementById('teksKamera').innerText = "Ketuk untuk Foto Selfie";
          btn.disabled = false; btn.innerHTML = 'KIRIM ABSENSI <i class="fas fa-paper-plane ms-1"></i>';
          
          muatRiwayat(namaUser);
          aturOtomatisAbsen();
        });
      } else {
        Swal.fire('Gagal Menyimpan', res.pesan, 'error');
        btn.disabled = false; btn.innerHTML = 'KIRIM ABSENSI <i class="fas fa-paper-plane ms-1"></i>';
      }
    })
    .catch(err => {
      Swal.fire('Error Server', 'Gagal mengirim data absensi.', 'error');
      btn.disabled = false; btn.innerHTML = 'KIRIM ABSENSI <i class="fas fa-paper-plane ms-1"></i>';
    });
  }

  function muatRiwayat(nama) {
    const tbody = document.getElementById('isiRiwayat');
    tbody.innerHTML = '<tr><td colspan="3" class="text-center py-3"><i class="fas fa-spinner fa-spin"></i> Memuat data...</td></tr>';
    
    const targetUrl = `${API_URL}?action=riwayat&nama=${encodeURIComponent(nama)}`;

    fetch(targetUrl)
      .then(response => response.json())
      .then(data => {
        tbody.innerHTML = '';
        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" class="text-center py-3 text-muted">Belum ada riwayat.</td></tr>';
          return;
        }
        data.forEach(function(item) {
          let colorS = (item.status === 'Terlambat' || item.status === 'Pulang Cepat') ? '#dc2626' : '#16a34a';
          let row = `<tr>
            <td class="fw-medium">${item.waktu}</td>
            <td><span class="badge bg-secondary">${item.tipe}</span></td>
            <td style="color:${colorS}; font-weight:700;">${item.status}</td>
          </tr>`;
          tbody.innerHTML += row;
        });
      })
      .catch(err => {
        tbody.innerHTML = '<tr><td colspan="3" class="text-center py-3 text-danger">Gagal memuat riwayat</td></tr>';
      });
  }

  function pancingIzinSistem() {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({video:true})
        .then(s => s.getTracks().forEach(t => t.stop()))
        .catch(e => console.log("Izin kamera ditolak atau diblokir"));
    }
  }

  window.onload = function() {
    if (sessionStorage.getItem('statusLogin') === 'sudah_login') {
      const nama = sessionStorage.getItem('namaPegawaiSesi');
      document.getElementById('halamanLogin').style.display = 'none';
      document.getElementById('halamanAbsen').style.display = 'block';
      document.getElementById('tampilNamaLengkap').innerText = nama;
      document.getElementById('namaPegawai').value = nama;
      muatRiwayat(nama);
      cekLokasi();
      aturOtomatisAbsen();
    }
  };
</script>
</body>
</html>
